---
name: bump

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daftar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update the cask to the latest notes-mac release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R parham-alvani/notes-mac --json tagName -q .tagName)
          version=${tag#v}
          if grep -q "version \"$version\"" Casks/daftar.rb; then
            echo "daftar is already at $version"
            exit 0
          fi
          digest=$(gh release view "$tag" -R parham-alvani/notes-mac --json assets \
            -q ".assets[] | select(.name == \"Daftar-$version.zip\") | .digest")
          sha256=${digest#sha256:}
          test ${#sha256} -eq 64
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha256\"/" Casks/daftar.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "daftar $version"
          git push
