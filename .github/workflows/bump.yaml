---
name: bump

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # A push with the workflow's token starts no workflow, so a bump starts CI itself.
  actions: write

jobs:
  daftar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update the cask to the latest notes-mac release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R parham-alvani/notes-mac --json tagName -q .tagName)
          version=${tag#v}
          if grep -q "version \"$version\"" Casks/daftar.rb; then
            echo "daftar is already at $version"
            exit 0
          fi
          digest=$(gh release view "$tag" -R parham-alvani/notes-mac --json assets \
            -q ".assets[] | select(.name == \"Daftar-$version.zip\") | .digest")
          sha256=${digest#sha256:}
          test ${#sha256} -eq 64
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha256\"/" Casks/daftar.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "daftar $version"
          git push
          gh workflow run ci.yaml

  daftar-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update the formula to the latest notes-linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R parham-alvani/notes-linux --json tagName -q .tagName)
          version=${tag#v}
          current=$(grep -m1 -oE 'releases/download/v[^/]+/' Formula/daftar-cli.rb | sed -E 's|releases/download/v(.*)/|\1|')
          if [ "$current" = "$version" ]; then
            echo "daftar-cli is already at $version"
            exit 0
          fi
          # Homebrew reads the version from the urls.
          sed -i "s|/v$current/daftar-cli-$current-|/v$version/daftar-cli-$version-|" Formula/daftar-cli.rb
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            digest=$(gh release view "$tag" -R parham-alvani/notes-linux --json assets \
              -q ".assets[] | select(.name == \"daftar-cli-$version-$target.tar.gz\") | .digest")
            sha256=${digest#sha256:}
            test ${#sha256} -eq 64
            # The checksum is on the line after its url.
            sed -i -E "/-$target\.tar\.gz\"/{n;s/sha256 \".*\"/sha256 \"$sha256\"/}" Formula/daftar-cli.rb
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "daftar-cli $version"
          # The cask job may have pushed meanwhile.
          git pull --rebase -q
          git push
          gh workflow run ci.yaml
